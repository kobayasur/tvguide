name: Daily TV Schedule Notifier

on:
  schedule:
    - cron: '0 3 * * *'  # UTC 3:00 = 日本時間 12:00
  workflow_dispatch:      # GitHub画面から手動実行できるようにする

jobs:
  send-tv-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # このスクリプトは標準ライブラリのみで動くため追加のpipインストールは不要ですが、必要に応じて記述可能

      - name: Run TV schedule script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tv_schedule_bot.py